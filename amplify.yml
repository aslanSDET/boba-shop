# Amplify Hosting build spec — Snowdaes.
#
# ── WHAT GOES IN .env.production, AND WHAT MUST NOT ──────────────────────────
#
# Amplify's environment variables are a BUILD-TIME facility: a Next route
# handler does not see them at request time. AWS's documented workaround is the
# `env | grep ... >> .env.production` line below, which bakes values into the
# deployment artifact — and their own warning on that page is that anyone with
# access to the artifact can read them.
#
# So this file writes exactly two NON-SECRET values, and no credential ever.
# The Clover tokens are read at request time from SSM Parameter Store by the SSR
# compute role; see src/pos/clover/creds.ts.
#
#   RESTAURANT  — not a secret, and REQUIRED here rather than only in the
#                 console. src/restaurants/active.ts reads it at module load.
#                 That works during the build, but the Lambda re-evaluates the
#                 module per request with no env var and falls back to
#                 "snowdaes". Correct by accident on this deployment; wrong the
#                 day Asian Kitchen ships, when its API routes would answer as
#                 Snowdaes instead of 404ing.
#   CLOVER_ENV  — not a secret. Also defaults to "sandbox" in code, but a
#                 default that happens to be safe is not the same as a stated
#                 one, and this is the variable that decides whether a write can
#                 reach a working kitchen.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - env | grep -e '^RESTAURANT=' -e '^CLOVER_ENV=' >> .env.production || true
        - npm run build
  artifacts:
    # .next, not out — this app has four dynamic API routes, so it deploys to
    # Amplify Hosting compute (WEB_COMPUTE), not as a static export. A wrong
    # baseDirectory here is a blank page in production with no error.
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
      - .next/cache/**/*

# ── STATIC ASSET CACHING ──────────────────────────────────────────────────────
#
# Measured on the deployed site, not assumed:
#
#   /_next/static/chunks/*.js   cache-control: public, max-age=31536000, immutable
#   /menu/items/almond-joy.jpg  cache-control: max-age=5, stale-while-revalidate
#
# Next content-hashes its own build output and Amplify honours that, so
# `/_next/*` is already correct and is deliberately NOT listed below. What is
# wrong is everything served straight out of `public/`: Amplify's default for
# those is five seconds, on a 39KB photograph that has not changed since it was
# imported.
#
# That default quietly cancels the reason a CDN was chosen at all. The argument
# in CLOVER-AND-LAUNCH.md §8 was never cost — it was that almost all traffic is
# cellular, on a mid-range Android, standing outside the shop. Re-validating
# every image every five seconds is the one behaviour that argument cannot
# survive.
#
# ── WHY ONE WEEK AND NOT `immutable` ─────────────────────────────────────────
#
# These filenames are slugs, not content hashes: `scripts/import-menu.mjs`
# matches photos to items by name, so re-shooting the Thai Dye writes the same
# `/menu/items/thai-dye.jpg` path. `immutable` for a year would mean a replaced
# photo never reaching anyone who had already seen the old one.
#
# A week with `stale-while-revalidate` keeps the phone-on-cellular win, and
# bounds how long a swapped photo can be wrong. If a photo has to change
# immediately, change its filename — the import script derives it from the item
# name, so that is a rename rather than a cache problem.
customHeaders:
  - pattern: '/menu/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=604800, stale-while-revalidate=86400'
  - pattern: '/brand/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=604800, stale-while-revalidate=86400'
  - pattern: '**/*.avif'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=604800, stale-while-revalidate=86400'
